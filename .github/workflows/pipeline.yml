name: Data Pipeline

on:
  # Every day at 07:00 UTC (03:00 EST / 09:00 CET)
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_SSLMODE: require
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Extract & load FRED data
        id: fred
        continue-on-error: true
        run: python -m ingestion.load_raw

      - name: Extract & load World Bank data
        id: worldbank
        continue-on-error: true
        run: python -m ingestion.load_worldbank

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: Check source freshness
        working-directory: dbt
        run: dbt source freshness --target prod

      - name: dbt build (seed, run, test)
        working-directory: dbt
        run: dbt build --target prod

      # Loaders run with continue-on-error so one failing API does not block
      # the other source or dbt; fail the job here so the failure stays visible.
      - name: Fail if an extractor failed
        if: steps.fred.outcome == 'failure' || steps.worldbank.outcome == 'failure'
        run: |
          echo "FRED: ${{ steps.fred.outcome }} / World Bank: ${{ steps.worldbank.outcome }}"
          exit 1
