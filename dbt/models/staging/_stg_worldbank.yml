version: 2

models:
  - name: stg_worldbank__observations
    description: World Bank observations with missing values removed.
    columns:
      - name: country_iso3
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('countries')
                field: iso3
      - name: indicator_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('wb_indicators')
                field: indicator_code
      - name: year
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, indicator_code, year]

  - name: stg_pipeline__ingestion_runs
    description: Extractor run log with run duration.
    columns:
      - name: run_id
        data_tests: [unique, not_null]
