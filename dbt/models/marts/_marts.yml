version: 2

models:
  - name: dim_indicator
    description: One row per FRED series with business metadata and data coverage.
    columns:
      - name: series_id
        description: FRED series identifier (primary key).
        data_tests: [unique, not_null]
      - name: indicator_name
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ["Macroeconomic", "Labor Market", "Inflation & Prices", "Interest Rates", "Housing", "Production & Business", "Markets"]
      - name: frequency
        description: Native FRED frequency (D, W, M, Q).
        data_tests:
          - accepted_values:
              arguments:
                values: ["D", "W", "M", "Q"]
      - name: transform
        description: "`yoy` when the indicator is read as a year-over-year % change (price indices, volumes), `level` otherwise."
        data_tests:
          - accepted_values:
              arguments:
                values: ["level", "yoy"]
      - name: display_unit
        description: Unit of `display_value` in `fct_indicator_monthly`.
      - name: n_observations
        description: Non-null observations available for the series.

  - name: dim_date
    description: Daily calendar from 2000-01-01 to the end of the current year.
    columns:
      - name: date
        data_tests: [unique, not_null]

  - name: fct_observations
    description: Observations at each series' native frequency. Use for daily market charts.
    columns:
      - name: series_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_indicator')
                field: series_id
      - name: observation_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [series_id, observation_date]

  - name: fct_indicator_monthly
    description: >
      One row per series and month. Daily and weekly series are averaged over
      the month. Includes period-over-period and year-over-year changes.
    columns:
      - name: series_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_indicator')
                field: series_id
      - name: month_date
        description: First day of the month.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: value
        description: Monthly value (average of the month for daily and weekly series).
        data_tests: [not_null]
      - name: prev_period_pct
        description: "% change vs the previous available period (previous month, or previous quarter for GDP)."
      - name: yoy_pct
        description: "% change vs the same month one year earlier."
      - name: yoy_change
        description: Absolute change vs the same month one year earlier (use for rates).
      - name: display_value
        description: Headline value as usually reported, `yoy_pct` when `transform = yoy`, `value` otherwise.
      - name: n_observations
        description: Number of native observations averaged into the month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [series_id, month_date]

  - name: dim_country
    description: One row per country tracked in the country comparison (G7 + China, India, Brazil).
    columns:
      - name: iso3
        description: ISO 3166-1 alpha-3 code (primary key).
        data_tests: [unique, not_null]
      - name: country_name
        data_tests: [unique, not_null]
      - name: country_group
        data_tests:
          - accepted_values:
              arguments:
                values: ["G7", "Emerging"]

  - name: dim_wb_indicator
    description: One row per World Bank indicator with business metadata and data coverage.
    columns:
      - name: indicator_code
        description: World Bank indicator code (primary key).
        data_tests: [unique, not_null]
      - name: indicator_name
        data_tests: [unique, not_null]
      - name: better_direction
        description: "`up` when a higher value is better, `down` when lower is better, `none` when neither."
        data_tests:
          - accepted_values:
              arguments:
                values: ["up", "down", "none"]
      - name: n_countries
        description: Countries with at least one value for the indicator.

  - name: fct_country_indicator_annual
    description: >
      One row per country, indicator and year from the World Bank. Includes
      the change vs the previous year and the country's rank among the
      tracked countries (1 = best).
    columns:
      - name: country_iso3
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: iso3
      - name: indicator_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wb_indicator')
                field: indicator_code
      - name: year
        data_tests: [not_null]
      - name: rank_in_year
        description: 1 = best performer for that indicator and year (largest value when there is no better direction).
      - name: is_latest_year
        description: True for the most recent year available for the country and indicator.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, indicator_code, year]

  - name: fct_ingestion_runs
    description: One row per extractor run (FRED and World Bank), for the pipeline health page.
    columns:
      - name: run_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["success", "partial", "failed"]

  - name: rpt_source_freshness
    description: One row per source with last successful load, data coverage and freshness status.
    columns:
      - name: source
        data_tests: [unique, not_null]
      - name: freshness_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["fresh", "stale", "never run"]
